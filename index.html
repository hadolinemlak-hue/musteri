<!DOCTYPE html>

<html lang="tr">
<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
/>

<meta name="theme-color" content="#FF7A00" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Emlak CRM" />

<link rel="manifest" href="manifest.json" />

<title>Emlak CRM</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<link rel="stylesheet" href="style.css" />

</head>

<body>

<div id="app">

<header>

  <div class="header-row">

```
<div>
  <h1>Emlak CRM</h1>
  <div class="sub">Mobil Portföy Yönetimi</div>
</div>
```

  </div>

</header>

<div class="container">

  <div class="stats">

```
<div class="stat">
  <div class="v" id="portfolioCount">0</div>
  <div class="l">Portföy</div>
</div>

<div class="stat">
  <div class="v">iOS</div>
  <div class="l">Uyumlu</div>
</div>
```

  </div>

  <div class="search">
    <input
      type="text"
      id="searchInput"
      placeholder="İlan ara..."
    />
  </div>

  <div id="portfolioList"></div>

</div>

<button class="fab" id="fabBtn">
  <i class="fa-solid fa-plus"></i>
</button>

<nav class="bottom">

  <button class="nav-btn active">
    <i class="fa-solid fa-building"></i>
    <span>Portföy</span>
  </button>

  <button class="nav-btn">
    <i class="fa-solid fa-users"></i>
    <span>Müşteri</span>
  </button>

  <button class="nav-btn">
    <i class="fa-solid fa-link"></i>
    <span>Eşleşme</span>
  </button>

</nav>

</div>

<div class="modal-overlay" id="modal">

  <div class="modal">

```
<div class="modal-header">

  <h2>Yeni İlan</h2>

  <button class="btn btn-secondary" id="closeModal">
    Kapat
  </button>

</div>

<div class="modal-body">

  <div class="form-group">

    <label>Başlık</label>

    <input
      type="text"
      id="titleInput"
    />

  </div>

  <div class="form-group">

    <label>Fiyat</label>

    <input
      type="number"
      id="priceInput"
    />

  </div>

  <div class="form-group">

    <label>Şehir</label>

    <input
      type="text"
      id="cityInput"
    />

  </div>

  <div class="form-group">

    <label>Fotoğraf</label>

    <div class="photo-zone">

      <i
        class="fa-solid fa-camera"
        style="font-size:32px;margin-bottom:10px;"
      ></i>

      <div>Fotoğraf Seç</div>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
        capture="environment"
      />

    </div>

    <div class="preview" id="preview"></div>

  </div>

  <button class="btn btn-primary" id="saveBtn">
    Kaydet
  </button>

</div>
```

  </div>

</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="app.js"></script>

</body>
</html>
