<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hadolin CRM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Hadolin CRM</h1>
</header>

<nav>
  <button onclick="showSection('dashboard')">Dashboard</button>
  <button onclick="showSection('portfolio')">Portföy</button>
  <button onclick="showSection('customers')">Müşteri</button>
  <button onclick="showSection('matching')">Eşleştirme</button>
</nav>

<main>

  <!-- DASHBOARD -->
  <section id="dashboard" class="active">

    <div class="stats-grid">

      <div class="stat-card">
        <h2 id="portfolioCount">0</h2>
        <p>Toplam İlan</p>
      </div>

      <div class="stat-card">
        <h2 id="customerCount">0</h2>
        <p>Toplam Müşteri</p>
      </div>

      <div class="stat-card">
        <h2 id="matchCount">0</h2>
        <p>Eşleştirme</p>
      </div>

    </div>

  </section>

  <!-- PORTFOLIO -->
  <section id="portfolio">

    <div class="card">
      <h2>Yeni İlan Ekle</h2>

      <input type="text" id="title" placeholder="İlan Başlığı">
      <input type="text" id="price" placeholder="Fiyat">
      <textarea id="description" placeholder="Açıklama"></textarea>

      <input type="file" id="images" multiple accept="image/*">

      <button onclick="addPortfolio()">İlan Ekle</button>
    </div>

    <div id="portfolioList"></div>

  </section>

  <!-- CUSTOMERS -->
  <section id="customers">

    <div class="card">
      <h2>Yeni Müşteri</h2>
      <section id="customersSection">
  <input type="text" id="customerName" placeholder="Ad Soyad">
  <input type="text" id="customerPhone" placeholder="Telefon">
  <input type="text" id="customerDemand" placeholder="Müşteri Talebi (Örn: 2+1 Satılık Daire)">
  <input type="text" id="customerNote" placeholder="Özel Notlar">



      
      
      
      <button onclick="addCustomer()">Müşteri Ekle</button>
    </div>

    <div id="customerList"></div>

  </section>

  <!-- MATCHING -->
  <section id="matching">

    <div class="card">
      <h2>Eşleştirme</h2>

      <select id="matchCustomer"></select>
      <select id="matchPortfolio"></select>

      <button onclick="addMatch()">Eşleştir</button>
    </div>

    <div id="matchList"></div>

  </section>

</main>

<script src="script.js"></script>
</body>
</html>
